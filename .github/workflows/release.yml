name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            python scripts/check_release.py --tag "$RELEASE_TAG"
          else
            python scripts/check_release.py
          fi
      - name: Install validation tools
        run: python -m pip install -e . build twine "ruff==0.16.0" "mypy==2.3.0"
      - name: Check release candidate
        run: |
          python -m unittest discover -s tests
          ruff check src tests scripts
          mypy src
          node --check docs/assets/demo.js
          node tests/demo_smoke.js
      - name: Build distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Test the source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/radar-source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/radar-source"
          cd "$RUNNER_TEMP"/radar-source/maintainer_radar-*
          PYTHONPATH=src python -m unittest discover -s tests
      - name: Smoke test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/radar-wheel"
          "$RUNNER_TEMP/radar-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/radar-wheel/bin/maintainer-radar" --help
          "$RUNNER_TEMP/radar-wheel/bin/maintainer-radar" from-json examples/sample-prs.json --now 2026-06-01T00:00:00Z
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
