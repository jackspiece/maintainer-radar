name: Maintainer Radar
description: Build read-only pull request triage reports for maintainers.
branding:
  icon: activity
  color: blue

inputs:
  repository:
    description: Repository to scan in owner/name form. Defaults to the workflow repository.
    required: false
    default: ""
  format:
    description: Report format.
    required: false
    default: markdown
  output:
    description: Single-line output file path (no CR or LF) for the report artifact. Defaults to maintainer-radar with the selected format extension.
    required: false
    default: ""
  limit:
    description: Maximum pull requests to scan.
    required: false
    default: "50"
  label:
    description: Only include pull requests with this label.
    required: false
    default: ""
  author:
    description: Only include pull requests by this author.
    required: false
    default: ""
  stale-days:
    description: Only include pull requests quiet for at least N days.
    required: false
    default: ""
  updated-since:
    description: Only include pull requests updated on or after this ISO date.
    required: false
    default: ""
  action:
    description: Only include pull requests with this recommended action slug.
    required: false
    default: ""
  min-score:
    description: Only include pull requests with reviewability greater than or equal to N.
    required: false
    default: ""
  max-risk:
    description: Only include pull requests with risk less than or equal to N.
    required: false
    default: ""
  sort:
    description: Sort order for queue output.
    required: false
    default: action
  top:
    description: Only include the first N pull requests after filtering and sorting.
    required: false
    default: ""
  group-by:
    description: "Group Markdown and HTML queue reports by a field. Supported value: action."
    required: false
    default: ""
  review-plan-minutes:
    description: Render a Markdown, HTML, or JSON review-session plan for this many maintainer minutes.
    required: false
    default: ""
  config:
    description: Optional path to a Maintainer Radar config JSON file.
    required: false
    default: ""
  hydrate:
    description: Fetch full pull request details for deeper scoring.
    required: false
    default: "true"
  step-summary:
    description: Publish Markdown output or a compact summary to the GitHub Actions run summary.
    required: false
    default: "true"

outputs:
  report-path:
    description: Path to the generated report file.
    value: ${{ steps.build.outputs.report-path }}
  summary-json:
    description: JSON summary for the generated report.
    value: ${{ steps.build.outputs.summary-json }}
  queue-headline:
    description: One-line human summary of the queue state.
    value: ${{ steps.build.outputs.queue-headline }}
  attention-level:
    description: "Queue attention level: quiet, review, triage, follow-up, or blocked."
    value: ${{ steps.build.outputs.attention-level }}
  attention-reason:
    description: One-line reason for the queue attention level.
    value: ${{ steps.build.outputs.attention-reason }}
  workflow-mode:
    description: Recommended maintainer workflow mode for the scanned queue.
    value: ${{ steps.build.outputs.workflow-mode }}
  workflow-recommendation:
    description: One-line recommended maintainer workflow for the scanned queue.
    value: ${{ steps.build.outputs.workflow-recommendation }}
  next-session-brief:
    description: One-line digest of what fits in the next 60 maintainer minutes.
    value: ${{ steps.build.outputs.next-session-brief }}
  total:
    description: Number of pull requests in the report after filters.
    value: ${{ steps.build.outputs.total }}
  review-now:
    description: Number of pull requests ready for review.
    value: ${{ steps.build.outputs.review-now }}
  author-follow-up:
    description: Number of pull requests needing author follow-up.
    value: ${{ steps.build.outputs.author-follow-up }}
  ci-blocked:
    description: Number of pull requests with failing CI.
    value: ${{ steps.build.outputs.ci-blocked }}
  ci-pending:
    description: Number of pull requests waiting for CI.
    value: ${{ steps.build.outputs.ci-pending }}
  merge-conflicts:
    description: Number of pull requests with merge conflicts.
    value: ${{ steps.build.outputs.merge-conflicts }}
  branch-behind:
    description: Number of pull requests behind the base branch.
    value: ${{ steps.build.outputs.branch-behind }}
  merge-gated:
    description: Number of pull requests blocked by repository merge gates.
    value: ${{ steps.build.outputs.merge-gated }}
  review-requested:
    description: Number of pull requests with requested reviewers or teams.
    value: ${{ steps.build.outputs.review-requested }}
  maintainer-blocked:
    description: Number of pull requests blocked by maintainer feedback or labels.
    value: ${{ steps.build.outputs.maintainer-blocked }}
  large-or-triage:
    description: Number of pull requests that are too large or need triage.
    value: ${{ steps.build.outputs.large-or-triage }}
  stale:
    description: Number of pull requests quiet for 7 or more days.
    value: ${{ steps.build.outputs.stale }}
  quick-unblocks:
    description: Number of pull requests that only need quick maintainer unblock action.
    value: ${{ steps.build.outputs.quick-unblocks }}
  watch-only:
    description: Number of pull requests waiting for CI or author action.
    value: ${{ steps.build.outputs.watch-only }}
  next-session-prs:
    description: Number of pull requests that fit in the default 60-minute session digest.
    value: ${{ steps.build.outputs.next-session-prs }}
  next-session-minutes:
    description: Estimated active maintainer minutes in the default 60-minute session digest.
    value: ${{ steps.build.outputs.next-session-minutes }}
  next-session-deferred:
    description: Number of pull requests deferred by the default 60-minute session digest.
    value: ${{ steps.build.outputs.next-session-deferred }}
  average-score:
    description: Average reviewability score for the report.
    value: ${{ steps.build.outputs.average-score }}
  plan-budget-minutes:
    description: Review-plan budget in minutes when review-plan-minutes is set.
    value: ${{ steps.build.outputs.plan-budget-minutes }}
  planned-prs:
    description: Number of pull requests included in the review plan.
    value: ${{ steps.build.outputs.planned-prs }}
  planned-minutes:
    description: Estimated active maintainer minutes in the review plan.
    value: ${{ steps.build.outputs.planned-minutes }}
  remaining-minutes:
    description: Unused minutes left in the review-plan budget.
    value: ${{ steps.build.outputs.remaining-minutes }}
  deferred-prs:
    description: Number of pull requests deferred by the review-plan budget.
    value: ${{ steps.build.outputs.deferred-prs }}
  watch-only-prs:
    description: Number of wait-for-CI or wait-for-author pull requests in the review plan.
    value: ${{ steps.build.outputs.watch-only-prs }}

runs:
  using: composite
  steps:
    - name: Install Maintainer Radar
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Build report
      id: build
      shell: bash
      env:
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_AUTHOR: ${{ inputs.author }}
        INPUT_STALE_DAYS: ${{ inputs.stale-days }}
        INPUT_UPDATED_SINCE: ${{ inputs.updated-since }}
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_MAX_RISK: ${{ inputs.max-risk }}
        INPUT_SORT: ${{ inputs.sort }}
        INPUT_TOP: ${{ inputs.top }}
        INPUT_GROUP_BY: ${{ inputs.group-by }}
        INPUT_REVIEW_PLAN_MINUTES: ${{ inputs.review-plan-minutes }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_HYDRATE: ${{ inputs.hydrate }}
        INPUT_STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        set -euo pipefail

        repository="${INPUT_REPOSITORY:-${GITHUB_REPOSITORY:-}}"
        if [ -z "$repository" ]; then
          echo "repository input is required when GITHUB_REPOSITORY is unavailable" >&2
          exit 2
        fi
        case "$INPUT_FORMAT" in
          markdown) default_output="maintainer-radar.md" ;;
          html) default_output="maintainer-radar.html" ;;
          json) default_output="maintainer-radar.json" ;;
          csv) default_output="maintainer-radar.csv" ;;
          *)
            echo "format must be markdown, html, json, or csv" >&2
            exit 2
            ;;
        esac
        if [ -n "$INPUT_REVIEW_PLAN_MINUTES" ]; then
          case "$INPUT_FORMAT" in
            markdown) default_output="review-plan.md" ;;
            html) default_output="review-plan.html" ;;
            json) default_output="review-plan.json" ;;
            csv)
              echo "review-plan-minutes requires format markdown, html, or json" >&2
              exit 2
              ;;
          esac
        fi
        output="${INPUT_OUTPUT:-$default_output}"
        # Keep the report path within one GitHub environment-file record.
        case "$output" in
          *$'\n'*|*$'\r'*)
            echo "output must be a single-line file path (no CR or LF)" >&2
            exit 2
            ;;
        esac
        mkdir -p -- "$(dirname -- "$output")"
        printf 'report-path=%s\n' "$output" >> "$GITHUB_OUTPUT"

        radar_args=(
          "--limit=$INPUT_LIMIT"
          "--sort=$INPUT_SORT"
        )
        if [ "$INPUT_HYDRATE" = "true" ]; then
          radar_args+=(--hydrate)
        fi
        if [ -n "$INPUT_TOP" ]; then
          radar_args+=("--top=$INPUT_TOP")
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          radar_args+=("--config=$INPUT_CONFIG")
        fi
        if [ -n "$INPUT_LABEL" ]; then
          radar_args+=("--label=$INPUT_LABEL")
        fi
        if [ -n "$INPUT_AUTHOR" ]; then
          radar_args+=("--author=$INPUT_AUTHOR")
        fi
        if [ -n "$INPUT_STALE_DAYS" ]; then
          radar_args+=("--stale-days=$INPUT_STALE_DAYS")
        fi
        if [ -n "$INPUT_UPDATED_SINCE" ]; then
          radar_args+=("--updated-since=$INPUT_UPDATED_SINCE")
        fi
        if [ -n "$INPUT_ACTION" ]; then
          radar_args+=("--action=$INPUT_ACTION")
        fi
        if [ -n "$INPUT_MIN_SCORE" ]; then
          radar_args+=("--min-score=$INPUT_MIN_SCORE")
        fi
        if [ -n "$INPUT_MAX_RISK" ]; then
          radar_args+=("--max-risk=$INPUT_MAX_RISK")
        fi

        # Scan the queue exactly once. Every report shape, summary output,
        # review-plan metric, and step summary below renders locally from
        # this analyses JSON without additional GitHub API calls.
        export ANALYSES_PATH="${RUNNER_TEMP:-/tmp}/maintainer-radar-analyses.json"
        maintainer-radar repo "$repository" "${radar_args[@]}" --format json > "$ANALYSES_PATH"

        export REPORT_FORMAT="$INPUT_FORMAT"
        export REPORT_OUTPUT_PATH="$output"
        export REPORT_GROUP_BY="$INPUT_GROUP_BY"
        export REVIEW_PLAN_MINUTES="$INPUT_REVIEW_PLAN_MINUTES"
        export STEP_SUMMARY_ENABLED="$INPUT_STEP_SUMMARY"
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        from maintainer_radar.render import (
            render_csv,
            render_html,
            render_markdown,
            render_review_plan_html,
            render_review_plan_json,
            render_review_plan_markdown,
            summarize_report,
            summarize_review_plan,
        )

        analyses = json.loads(Path(os.environ["ANALYSES_PATH"]).read_text(encoding="utf-8"))
        report_format = os.environ["REPORT_FORMAT"]
        group_by = os.environ.get("REPORT_GROUP_BY") or None
        plan_raw = os.environ.get("REVIEW_PLAN_MINUTES") or ""
        plan_minutes = int(plan_raw) if plan_raw else None
        report_path = Path(os.environ["REPORT_OUTPUT_PATH"])
        step_summary_enabled = os.environ.get("STEP_SUMMARY_ENABLED") == "true"

        if plan_minutes is not None:
            if report_format == "json":
                report = render_review_plan_json(analyses, plan_minutes)
            elif report_format == "html":
                report = render_review_plan_html(analyses, plan_minutes)
            else:
                report = render_review_plan_markdown(analyses, plan_minutes)
        elif report_format == "json":
            report = json.dumps(analyses, indent=2) + "\n"
        elif report_format == "csv":
            report = render_csv(analyses)
        elif report_format == "html":
            report = render_html(analyses, summary_only=False, group_by=group_by)
        else:
            report = render_markdown(analyses, group_by=group_by)
        report_path.write_text(report, encoding="utf-8")

        summary = summarize_report(analyses)
        output_lines = [
            "summary-json<<MAINTAINER_RADAR_SUMMARY",
            json.dumps(summary, indent=2),
            "MAINTAINER_RADAR_SUMMARY",
        ]
        numeric_outputs = {
            "total": "total",
            "review-now": "review_now",
            "author-follow-up": "author_follow_up",
            "ci-blocked": "ci_blocked",
            "ci-pending": "ci_pending",
            "merge-conflicts": "merge_conflicts",
            "branch-behind": "branch_behind",
            "merge-gated": "merge_gated",
            "review-requested": "review_requested",
            "maintainer-blocked": "maintainer_blocked",
            "large-or-triage": "large_or_triage",
            "stale": "stale",
            "quick-unblocks": "quick_unblocks",
            "watch-only": "watch_only",
            "next-session-prs": "next_session_prs",
            "next-session-minutes": "next_session_minutes",
            "next-session-deferred": "next_session_deferred",
            "average-score": "average_score",
        }
        for output_name, summary_key in numeric_outputs.items():
            output_lines.append(f"{output_name}={int(summary.get(summary_key) or 0)}")
        text_outputs = {
            "queue-headline": "queue_headline",
            "attention-level": "attention_level",
            "attention-reason": "attention_reason",
            "workflow-mode": "workflow_mode",
            "workflow-recommendation": "workflow_recommendation",
            "next-session-brief": "next_session_brief",
        }
        for output_name, summary_key in text_outputs.items():
            value = str(summary.get(summary_key) or "").replace("\n", " ")
            output_lines.append(f"{output_name}={value}")

        plan_summary = None
        if plan_minutes is not None:
            plan_summary = summarize_review_plan(analyses, plan_minutes)
            plan_outputs = {
                "plan-budget-minutes": "plan_budget_minutes",
                "planned-prs": "planned_prs",
                "planned-minutes": "planned_minutes",
                "remaining-minutes": "remaining_minutes",
                "deferred-prs": "deferred_prs",
                "watch-only-prs": "watch_only_prs",
            }
            for output_name, summary_key in plan_outputs.items():
                output_lines.append(f"{output_name}={int(plan_summary.get(summary_key) or 0)}")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write("\n".join(output_lines) + "\n")

        if step_summary_enabled:
            if report_format == "markdown":
                step_summary = report
            else:
                ci_total = int(summary.get("ci_blocked") or 0) + int(summary.get("ci_pending") or 0)
                lines = [
                    "## Maintainer Radar Summary",
                    "",
                    str(summary.get("queue_headline") or ""),
                    "",
                    f"- Attention level: {summary.get('attention_level') or 'quiet'}",
                    f"- Attention reason: {summary.get('attention_reason') or ''}",
                    f"- Workflow mode: {summary.get('workflow_mode') or 'quiet'}",
                    f"- Workflow recommendation: {summary.get('workflow_recommendation') or ''}",
                    f"- Next session: {summary.get('next_session_brief') or ''}",
                    f"- PRs scanned: {int(summary.get('total') or 0)}",
                    f"- Review now: {int(summary.get('review_now') or 0)}",
                    f"- Needs author follow-up: {int(summary.get('author_follow_up') or 0)}",
                    f"- CI blocked or pending: {ci_total}",
                    f"- Maintainer blocked: {int(summary.get('maintainer_blocked') or 0)}",
                    f"- Large or needs triage: {int(summary.get('large_or_triage') or 0)}",
                    f"- Stale 7+ days: {int(summary.get('stale') or 0)}",
                    f"- Quick unblocks: {int(summary.get('quick_unblocks') or 0)}",
                    f"- Watch only: {int(summary.get('watch_only') or 0)}",
                    f"- Next-session PRs: {int(summary.get('next_session_prs') or 0)}",
                    f"- Next-session active time: {int(summary.get('next_session_minutes') or 0)} minutes",
                    f"- Next-session deferred: {int(summary.get('next_session_deferred') or 0)}",
                    f"- Average reviewability: {int(summary.get('average_score') or 0)}/100",
                    "",
                ]
                if plan_summary is not None:
                    lines.extend(
                        [
                            "## Maintainer Radar Review Plan",
                            "",
                            f"- Time budget: {int(plan_summary.get('plan_budget_minutes') or 0)} minutes",
                            f"- Planned PRs: {int(plan_summary.get('planned_prs') or 0)}",
                            f"- Estimated active time: {int(plan_summary.get('planned_minutes') or 0)} minutes",
                            f"- Left for interrupts: {int(plan_summary.get('remaining_minutes') or 0)} minutes",
                            f"- Deferred by budget: {int(plan_summary.get('deferred_prs') or 0)}",
                            f"- Watch only: {int(plan_summary.get('watch_only_prs') or 0)}",
                            "",
                        ]
                    )
                step_summary = "\n".join(lines)
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                fh.write(step_summary if step_summary.endswith("\n") else step_summary + "\n")
        PY
